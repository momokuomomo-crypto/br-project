name: 00 Probe

# 初期確認用：Actionsから公式サイトに届くか確かめ、解析用のサンプルを保存する。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/00_probe.yml"]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install lhafile requests
      - name: Fetch samples
        run: |
          python - <<'PY'
          import io, os, time, requests, lhafile
          os.makedirs("samples", exist_ok=True)
          s = requests.Session(); s.headers["User-Agent"] = "br-project/1.0 (personal research; low-rate collector)"
          log = []
          for kind, hd in [("B","20241123"),("K","20241123"),("B","20261122"),("K","20261122"),("B","20261124")]:
              url = f"https://www1.mbrace.or.jp/od2/{kind}/{hd[:6]}/{kind.lower()}{hd[2:]}.lzh"
              t = time.time(); r = s.get(url, timeout=30); log.append(f"{url} {r.status_code} {len(r.content)} {time.time()-t:.2f}s")
              if r.status_code == 200:
                  a = lhafile.Lhafile(io.BytesIO(r.content)); n = a.namelist()[0]
                  txt = a.read(n).decode("cp932", errors="replace")
                  open(f"samples/{kind}{hd}.txt","w",encoding="utf-8").write(txt)
          for page in ["odds3t","odds2tf","oddstf","racelist","raceresult"]:
              url = f"https://www.boatrace.jp/owpc/pc/race/{page}?rno=12&jcd=02&hd=20241123"
              t = time.time(); r = s.get(url, timeout=30); log.append(f"{url} {r.status_code} {len(r.content)} {time.time()-t:.2f}s")
              if r.status_code == 200:
                  open(f"samples/{page}.html","w",encoding="utf-8").write(r.content.decode("utf-8"))
          for hd in ["20241123", "20261124"]:
              r = s.get(f"https://www.boatrace.jp/owpc/pc/race/index?hd={hd}", timeout=30); log.append(f"index {hd} {r.status_code} {len(r.content)}")
              if r.status_code == 200: open(f"samples/index_{hd}.html","w",encoding="utf-8").write(r.content.decode("utf-8"))
          t=time.time()
          for i in range(10):
              s.get("https://www.boatrace.jp/owpc/pc/race/odds3t", params={"rno": i+1, "jcd": "02", "hd": "20241123"}, timeout=30)
          log.append(f"10 sequential odds3t: {time.time()-t:.1f}s")
          open("samples/probe_log.txt","w").write("\n".join(log)+"\n")
          print("\n".join(log))
          PY
      - name: Commit samples
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add samples
          git diff --cached --quiet || git commit -m "chore: 公式サイトのサンプルを保存 [skip ci]"
          git push
