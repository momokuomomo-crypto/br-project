name: 11 Predict

# 06_01_自動実行設計.md 4章。
# 8:00〜21:59（JST）の10分ごとに、締切が近く直前情報がそろったレースを予想して
# data/predictions/ に記録し、ダッシュボードを更新する。

on:
  schedule:
    - cron: "*/10 23 * * *"   # 8:00〜8:59 JST
    - cron: "*/10 0-12 * * *" # 9:00〜21:59 JST
  workflow_dispatch:

concurrency:
  group: 11-predict
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Predict
        run: python -m br.main predict
      - name: Commit and push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ../data/predictions
          if ! git diff --cached --quiet; then
            git commit -m "data: 当日の予想を記録 [skip ci]"
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  pages:
    needs: predict
    if: needs.predict.outputs.changed == 'true'
    uses: ./.github/workflows/21_pages.yml
    permissions:
      pages: write
      id-token: write
