name: 11 Predict

# 06_01_自動実行設計.md 4章。
# 8:00〜21:59（JST）の15分ごとに、締切が近いレースの発売中オッズを取得して
# 期待値派の予想を data/predictions/ に記録し、ダッシュボードを更新する。

on:
  schedule:
    - cron: "*/15 23 * * *"   # 8:00〜8:59 JST
    - cron: "*/15 0-12 * * *" # 9:00〜21:59 JST
  workflow_dispatch:

concurrency:
  group: 11-predict
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  predict:
    runs-on: [self-hosted, jp]
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    defaults:
      run:
        shell: powershell
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install dependencies
        run: python -m pip install --quiet -r requirements.txt
      - name: Predict
        run: |
          $env:PYTHONIOENCODING = "utf-8"
          python -m br.main predict
      - name: Commit and push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ../data
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "data: 当日の予想を記録"
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
            "changed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
          exit 0

  pages:
    needs: predict
    if: needs.predict.outputs.changed == 'true'
    uses: ./.github/workflows/21_pages.yml
    permissions:
      pages: write
      id-token: write
