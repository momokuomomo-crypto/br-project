name: 20 Analyze

# 06_01_自動実行設計.md 2章。
# data/input/ に push されたら（収集の後にも呼ばれる）、期待値派の検証と
# 運用モデルの学習を行い data/output/ へ保存し、ダッシュボードを更新する。
# 公式サイトにはアクセスしないのでクラウド（ubuntu-latest）で動かす。

on:
  push:
    branches: [main]
    paths: ["data/input/**", "scripts/br/analysis/**"]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: 20-analyze
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - name: Tests
        run: python -m pytest -q tests
      - name: Backtest and train
        continue-on-error: true
        run: python -m br.main backtest
      - name: Commit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ../data/output
          git diff --cached --quiet || git commit -m "chore: 期待値派の検証結果と運用モデルを更新 [skip ci]"
          git pull --rebase -X theirs origin main
          git push origin HEAD:main

  pages:
    needs: analyze
    if: always()
    uses: ./.github/workflows/21_pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
