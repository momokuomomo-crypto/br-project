name: 10 Collect

# 06_01_自動実行設計.md 3章。
# 毎朝6:00（JST）に直近7日分（取りこぼし・修正分を含む）の出走表・直前情報・結果・払戻を
# Boatrace Open API から取得して data/input/ に保存・push し、続けて分析・ダッシュボード更新を行う。

on:
  schedule:
    - cron: "0 21 * * *" # 21:00 UTC = 6:00 JST
  workflow_dispatch:

concurrency:
  group: 10-collect
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Collect
        run: python -m br.main yesterday
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ../data
          git diff --cached --quiet || git commit -m "data: 直近7日分の出走表・直前情報・結果を収集"
          git pull --rebase -X theirs origin main
          git push origin HEAD:main

  analyze:
    needs: collect
    uses: ./.github/workflows/20_analyze.yml
    permissions:
      contents: write
      pages: write
      id-token: write
