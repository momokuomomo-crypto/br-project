name: 12 Backfill

# 06_01_自動実行設計.md 5章。過去データを新しい月から1か月ずつ取り込み、月ごとに push する。
# 期間は .github/backfill.json（{"from": "YYYY-MM-DD", "to": "YYYY-MM-DD"}）で指定し、
# このファイルを push すると始まる（手動実行も可）。取得済みの日は飛ばすので、途中で止まっても再実行すれば続きから取る。

on:
  push:
    branches: [main]
    paths: [".github/backfill.json"]
  workflow_dispatch:

concurrency:
  group: 12-backfill
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Backfill
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          FROM=$(python -c "import json;print(json.load(open('../.github/backfill.json'))['from'])")
          TO=$(python -c "import json;print(json.load(open('../.github/backfill.json'))['to'])")
          python -m br.main backfill --from "$FROM" --to "$TO" --budget-min 320

  analyze:
    needs: backfill
    if: always()
    uses: ./.github/workflows/20_analyze.yml
    permissions:
      contents: write
      pages: write
      id-token: write
